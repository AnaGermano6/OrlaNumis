  handlers.CollectionClassification:
    properties:
      count:
        type: integer
      key:
        description: |-
          Key is "standard", "circulating-commemorative", "non-circulating" or,
          for another kind, its label; it is the coin list's classification filter.
        type: string
      label:
        description: Label is Numista's name for it, in the language it was looked
          up in.
        type: string
    type: object
  handlers.CollectionCurrencyRequest:
    properties:
      currency:
        description: Currency is EUR or a currency of the ECB reference rates (USD,
          GBP, CHF…).
        example: EUR
        type: string
    required:
    - currency
    type: object
  handlers.CollectionSummaryResponse:
    properties:
      circulationUnknown:
        type: integer
      classifications:
        description: |-
          Classifications are Numista's kinds of coin found in the collection,
          the usual ones first; coins Numista says nothing of are in none. Each
          coin counts once, as the gallery lists it.
        items:
          $ref: '#/definitions/handlers.CollectionClassification'
        type: array
      coincards:
        description: Coincards counts coins whose presentation is "coincard".
        type: integer
      coins:
        type: integer
      commemorativeCoins:
        description: |-
          CommemorativeCoins are of types Numista says commemorate something;
          CommemorativeUnknown are coins it says nothing of.
        type: integer
      commemorativeUnknown:
        type: integer
      countries:
        type: integer
      currency:
        description: |-
          Currency is the collection currency (an ISO code: EUR, USD, GBP…):
          TotalValue and the highlights' values are in it.
        example: EUR
        type: string
      currentCoins:
        description: |-
          CurrentCoins are circulation coins still legal tender, as Numista says
          of their types (collector coins are not);
          CirculationUnknown are coins it says nothing of (not linked to Numista).
          These four count every coin held, with its quantity.
        type: integer
      exchangeRate:
        allOf:
        - $ref: '#/definitions/services.ExchangeRate'
        description: ExchangeRate is the latest ECB rate for the US dollar, when available.
      extinctCountries:
        description: |-
          ExtinctCountries counts the collection's countries that no longer exist
          (USSR, Yugoslavia, Ottoman Empire…); they are among Countries.
        type: integer
      highlights:
        $ref: '#/definitions/repository.CollectionHighlights'
      repeatedCoins:
        description: |-
          RepeatedCoins are the different coins held more than once; SpareCoins
          the copies beyond the first, there to trade.
        type: integer
      spareCoins:
        type: integer
      totalValue:
        description: |-
          TotalValue sums the coins' current values times their quantities, in
          the collection currency.
        type: number
      totalValueEur:
        description: |-
          TotalValueEUR is TotalValue in euros: as is for a euro collection, else
          converted with the ECB rate of its currency; null when no rate is available.
        type: number
      types:
        description: |-
          Types counts distinct coin types: coins linked to the same Numista type
          count once; other coins count once per distinct name.
        type: integer
      uniqueCoins:
        description: UniqueCoins counts each coin once, whatever its quantity.
        type: integer
      unvaluedCoins:
        description: UnvaluedCoins have no current value and are left out of TotalValue.
        type: integer
      withoutCountry:
        type: integer
    type: object
