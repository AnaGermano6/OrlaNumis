      - Coins
  /coin-options:
    get:
      description: Returns the admin-configured category and era choices with translated
        display names, and the collection currency (EUR, USD, GBP…) coin prices and
        values are kept in
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CoinOptionsResponse'
      security:
      - BearerAuth: []
      summary: Get coin category and era options
      tags:
      - Coins
  /coin-photos/search:
    get:
      description: 'Returns real photos of a coin with their author and license: the
        ECB''s image of a €2 commemorative coin (when year is given and the coin is
        one; match=exact when the ECB lists exactly this coin), the Numista catalogue
        photos of numistaTypeId, then Wikimedia Commons files matching q. Commons
        searches are cached for a week, ECB pages for longer. Import a chosen photo
        with POST /coins/{id}/images/import.'
      parameters:
      - description: Search text, e.g. title and year (required unless numistaTypeId,
          or year and country, are set)
        in: query
        name: q
        type: string
      - description: Numista type whose catalogue photos to include
        in: query
        name: numistaTypeId
        type: integer
      - default: en
        description: Language of catalogue data
        in: query
        name: lang
        type: string
      - description: Coin year, to look for a €2 commemorative on the ECB site
        in: query
        name: year
        type: integer
      - description: Coin country (English or Portuguese name)
        in: query
        name: country
        type: string
      - description: Coin denomination, e.g. 2 euro
        in: query
        name: denomination
        type: string
      - description: Coin subject, for a coin not linked to Numista
        in: query
        name: subject
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CoinPhotoSearchResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Search real coin photos
      tags:
      - Coins
  /coin-releases:
    get:
      description: 'The ECB''s €2 commemorative coins of the latest year it lists,
        and the collector coins the mints of Portugal (INCM), France (Monnaie de Paris)
        and Austria (Münze Österreich) sell, of the last twelve months and to come:
        upcoming first, then newest first. Each names its country and says whether
        a coin of the collection is it.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CoinReleasesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List new and upcoming coins
      tags:
      - Coins
  /coin-releases/numista-type:
    get:
      description: 'The Numista type of a coin of the releases or the catalogue, to
        fill in its details when it is added: its own when it comes from Numista,
        the one the catalogue knows it by, else the one of Numista''s coins of its
        country, year and face value whose ECB image, mint page or name is the coin''s.
        The candidates are those coins, to choose from when none is sure. Numista
        is asked once a day at most for a country, year and face value.'
      parameters:
      - description: Where the coin comes from
        enum:
        - ecb
        - incm
        - mdp
        - moe
        - numista
        in: query
        name: source
        required: true
        type: string
      - description: ISO code of its country; none for a joint issue
        in: query
        name: country
        type: string
      - description: Its title, as the release names it
        in: query
        name: title
        required: true
        type: string
      - description: Its (lowest) face value
        in: query
        name: faceValue
        required: true
        type: number
      - description: First month of issue (YYYY-MM)
        in: query
        name: from
        required: true
        type: string
      - description: Its page
        in: query
        name: pageUrl
        type: string
      - description: Its picture
        in: query
        name: imageUrl
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.ReleaseNumistaType'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Find the Numista type of a new coin
      tags:
      - Coins
  /coins:
    get:
      description: Returns a paginated, filterable list of coins belonging to the
        authenticated user.
      parameters:
      - description: Only coins or only banknotes (every item when omitted)
        enum:
        - coin
        - banknote
        in: query
        name: kind
        type: string
      - description: Filter by category, one of the admin-configured categories (Modern
          and Other by default)
        in: query
        name: category
        type: string
      - description: Filter by era (ancient, medieval, modern)
        in: query
        name: era
        type: string
      - description: Filter by country (exact)
        in: query
        name: country
        type: string
      - description: Filter by period (exact, e.g. República Portuguesa 1986–2001)
        in: query
        name: period
        type: string
      - description: Filter by face value, as written (\
        in: query
        name: denomination
        type: string
      - description: Filter by presentation
        enum:
        - loose
        - coincard
        - capsule
        - flip
        - proof_set
        - blister
        - slab
        in: query
        name: presentation
        type: string
      - description: Only coins held more than once (a quantity above one), the copies
          there to trade
        in: query
        name: repeated
        type: boolean
      - description: Only coins of countries that no longer exist (USSR, Yugoslavia,
          Ottoman Empire…)
        in: query
        name: extinct
        type: boolean
      - description: Only collection coins issued for circulation and still legal
          tender (current), or no longer legal tender (demonetized), as Numista says
          of their types; collector (non-circulating) coins are not current
        enum:
        - current
        - demonetized
        in: query
        name: circulation
        type: string
      - description: Only collection coins of commemorative types (true) or of regular
          ones (false), as Numista says
        in: query
        name: commemorative
        type: boolean
      - description: 'Only collection coins of one Numista kind of coin: standard,
          circulating-commemorative, non-circulating, or another kind''s label (see
          the summary''s classifications)'
        in: query
        name: classification
        type: string
      - description: Filter by rarity
        enum:
        - common
        - uncommon
        - scarce
        - rare
        - very_rare
        - extremely_rare
        in: query
        name: rarity
        type: string
      - description: Search across name, denomination, ruler, era, mint, inscriptions,
          notes, country and a banknote's serial number, series and signatures
        in: query
        name: search
        type: string
      - description: Filter by wishlist status
        enum:
        - "true"
        - "false"
        in: query
        name: wishlist
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 50
        description: Items per page (max 100)
        in: query
        name: limit
        type: integer
      - default: updated_at
        description: Sort field
        enum:
        - created_at
        - updated_at
        - current_value
        - purchase_date
        - name
        - quantity
        - random
        in: query
        name: sort
        type: string
      - default: desc
        description: Sort order
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CoinListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List coins
      tags:
      - Coins
    post:
      consumes:
      - application/json
      description: Creates a new coin record for the authenticated user.
      parameters:
      - description: Coin data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CoinCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Coin'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
