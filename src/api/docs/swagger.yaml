        maxLength: 2000
        type: string
      reverseInscription:
        maxLength: 1000
        type: string
      ruler:
        maxLength: 200
        type: string
      serialNumber:
        maxLength: 100
        type: string
      series:
        description: |-
          Banknote details: series, serial number, signatories, printer, size,
          watermark, replacement or specimen, and a grading company's grade.
          NumistaIssueID is the issue of the linked Numista type the item is (0: none).
        maxLength: 200
        type: string
      signatures:
        maxLength: 300
        type: string
      vendorInvoice:
        maxLength: 200
        type: string
      vendorSku:
        maxLength: 200
        type: string
      watermark:
        maxLength: 500
        type: string
      weightGrams:
        type: number
      widthMm:
        type: number
      year:
        description: Year is the coin's year (negative for BC); when omitted it is
          read from dateRange.
        maximum: 3000
        minimum: -5000
