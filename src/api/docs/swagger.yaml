      status:
        $ref: '#/definitions/models.RecommendationStatus'
      targetId:
        type: integer
      targetName:
        type: string
      targetType:
        $ref: '#/definitions/models.RecommendationTargetType'
    type: object
  services.CoinRelease:
    properties:
      country:
        description: |-
          Country is the issuing country's ISO code ("PT"); "" for a joint issue
          of the euro area countries.
        type: string
      currency:
        description: 'Currency is the face value''s, when not euros: "PTE" for escudos.'
        type: string
      faceValue:
        description: |-
          FaceValue is the lowest of the design's face values; FaceValues all of
          them, from the lowest, when there are several.
        type: number
      faceValues:
        items:
          type: number
        type: array
      from:
        description: |-
          From and To are the first and last month of the issue period ("2025-10"
          and "2025-12" for "Fourth quarter of 2025"); the same month when it is
          known; January to December when only the year is.
        example: 2025-10
        type: string
      id:
        description: |-
          ID identifies a coin of the catalogue (its first key), to hide it or
          join it to another.
        type: string
      imageUrl:
        type: string
      issueText:
        description: IssueText is the period as the ECB writes it, in English.
        type: string
      kind:
        enum:
        - commemorative
        - collector
        type: string
      owned:
        description: Owned is true when a coin of the collection is this one.
        type: boolean
      pageUrl:
        type: string
      sameAs:
        description: SameAs is, for a coin the user joined to another, that one's
          id.
        type: string
      source:
        enum:
        - ecb
        - incm
        - mdp
        - moe
        - numista
        type: string
      title:
        description: |-
          Title is what the coin shows: the ECB's feature (in English) or the
          mint's name for the design.
        type: string
      to:
        example: 2025-12
        type: string
      upcoming:
        description: |-
          Upcoming is true before the issue period starts, and during a month or
          a quarter of issue until it ends.
        type: boolean
      variants:
        description: Variants are the finishes and metals a mint sells the design
          in ("BNC", "Prata Proof").
        items:
          type: string
        type: array
      volume:
        description: Volume is how many are struck, when the source says.
        type: integer
      wishlist:
        description: |-
          Wishlist is true when a coin of the wishlist is this one;
          WishlistCoinID is that coin, to take it off the wishlist.
        type: boolean
      wishlistCoinId:
        type: integer
    type: object
  services.CoinReleaseGroup:
    properties:
      releases:
        items:
          $ref: '#/definitions/services.CoinRelease'
        type: array
      source:
        enum:
        - ecb
        - mints
        type: string
      year:
        description: |-
          Year is the year of the ECB's list (the latest it has published). The
          mints' releases are those of the last twelve months (of this year for a
          mint that gives only the year) and to come.
        type: integer
    type: object
  services.CoinStatus:
    properties:
      commemoratedTopic:
        type: string
      commemorative:
