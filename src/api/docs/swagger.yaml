        items:
          $ref: '#/definitions/services.HealthActionHint'
        type: array
      score:
        type: integer
      title:
        type: string
    type: object
  services.CoinHealthListResponse:
    properties:
      coins:
        items:
          $ref: '#/definitions/services.CoinHealthItem'
        type: array
