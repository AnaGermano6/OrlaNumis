          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Search Numista issuers
      tags:
      - Numista
  /numista/catalog/search:
    get:
      description: Returns one page (20 types unless count is set) of Numista coin
        types (or banknote types, with category=banknote) matching the text, issuer
        and/or catalogue reference (e.g. catalogue=KM, number=84), optionally limited
        to a year. Searches are cached for a day.
      parameters:
      - description: Search text (required unless issuer or catalogue is set)
        in: query
        name: q
        type: string
      - description: Numista issuer code, e.g. portugal
        in: query
        name: issuer
        type: string
      - description: Reference catalogue code (KM or Y); requires number
        enum:
        - KM
        - "Y"
        in: query
        name: catalogue
        type: string
      - description: Number in the reference catalogue, e.g. 84
        in: query
        name: number
        type: string
      - description: Year the type was issued (negative for BC)
        in: query
        name: year
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Types per page (1-50)
        in: query
        name: count
        type: integer
      - default: en
        description: Language of results
        in: query
        name: lang
        type: string
      - default: coin
        description: Coins or banknotes
        enum:
        - coin
        - banknote
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.NumistaCatalogSearchResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Search the Numista coin catalogue
      tags:
      - Numista
