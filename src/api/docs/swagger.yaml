    get:
      description: Downloads, as an Excel workbook (xlsx) or a CSV, the user's coins
        and banknotes that the filters keep (the same filters and order as GET /coins,
        without pages; up to 10,000), one row each with its details, purchase, value,
        references and sets. Columns are named in the language asked for; a CSV in
        Portuguese uses ";" and a decimal comma, as Excel there expects.
      parameters:
      - default: xlsx
        description: Spreadsheet format
        enum:
        - xlsx
        - csv
        in: query
        name: format
        type: string
      - default: pt
        description: Language of the columns
        enum:
        - pt
        - en
        in: query
        name: lang
        type: string
      - description: Only coins or only banknotes (every item when omitted)
        enum:
        - coin
        - banknote
        in: query
        name: kind
        type: string
      - description: Filter by wishlist status
        enum:
        - "true"
        - "false"
        in: query
        name: wishlist
        type: string
      - description: Filter by country (exact)
        in: query
        name: country
        type: string
      - description: Filter by period (exact)
        in: query
        name: period
        type: string
      - description: Filter by face value, as written
        in: query
        name: denomination
        type: string
      - description: Filter by presentation
        enum:
        - loose
        - coincard
        - capsule
        - flip
        - proof_set
        - blister
        - slab
        in: query
        name: presentation
        type: string
      - description: Filter by rarity
        enum:
        - common
        - uncommon
        - scarce
        - rare
        - very_rare
        - extremely_rare
        in: query
        name: rarity
        type: string
      - description: Only coins held more than once
        in: query
        name: repeated
        type: boolean
      - description: Only coins of countries that no longer exist
        in: query
        name: extinct
        type: boolean
      - description: Only current or demonetized coins, as Numista says
        enum:
        - current
        - demonetized
        in: query
        name: circulation
        type: string
      - description: Only commemorative (true) or regular (false) coins, as Numista
          says
        in: query
        name: commemorative
        type: boolean
      - description: Only one Numista kind of coin
        in: query
        name: classification
        type: string
      - description: Only the coins of a set
        in: query
        name: set
        type: integer
      - description: Search, as in the coin list
        in: query
        name: search
        type: string
      - default: updated_at
        description: Sort field
        enum:
        - created_at
        - updated_at
        - current_value
        - purchase_date
        - name
        - quantity
        - random
        in: query
        name: sort
        type: string
      - default: desc
        description: Sort order
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - text/csv
      responses:
        "200":
          description: The spreadsheet
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
