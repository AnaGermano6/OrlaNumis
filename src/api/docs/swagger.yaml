  /coins/statuses:
    get:
      description: 'Returns the IDs of the user''s collection coins (not the wishlist''s)
        that are circulation coins still legal tender (current), no longer legal tender
        (demonetized) or collector coins (nonCirculating), and that are commemorative
        or not, by the same rules as the summary and the coin list filters: a circulation
        set on the coin wins, else the cached Numista type says (never asking Numista);
        coins of extinct countries are not current. A coin nobody knows about is in
        neither list of a pair.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CoinStatusGroups'
