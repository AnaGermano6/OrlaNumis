          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List coins by legal tender and commemorative status
      tags:
      - Coins
  /coins/summary:
    get:
      description: Counts the user's collection coins (excluding the wishlist), their
        distinct types (coins linked to the same Numista type count once; other coins
        once per distinct name), their distinct countries (and how many of them no
        longer exist), how many circulation coins are still legal tender (from their
        cached Numista types; collector coins and coins of extinct countries are not)
        how many are commemorative and how many are of each Numista kind of coin (standard
        circulation, circulating commemorative, non-circulating…), how many coins
        have no country, and how many coins are in a coincard. Also sums the coins'
        current values (kept in the collection currency) and gives the total in euros,
        converted with the ECB daily reference rates (cached; null when unavailable),
        and names the rarest (fixed rarity scale; ties go to the more valuable), oldest
        (lowest year) and most valuable (current value) coins.
      parameters:
      - description: Only the coins or only the banknotes (every item when omitted)
        enum:
        - coin
        - banknote
        in: query
        name: kind
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CollectionSummaryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
