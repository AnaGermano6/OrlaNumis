  /coin-catalogue/joint-issues:
    get:
      description: The €2 coins the euro area's countries issued together (the Treaty
        of Rome in 2007, the EU flag in 2015…), newest first, each with every country's
        version.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.JointIssuesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Joint issues of the euro area
      tags:
      - Coins
  /coin-catalogue/overrides:
    delete:
      description: 'Forgets the user''s choice for a coin of the catalogue: hidden,
        it is listed again; joined to another, it is listed apart again.'
      parameters:
      - description: The coin's id
        in: query
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Show a coin of the catalogue again
      tags:
      - Coins
    put:
      consumes:
      - application/json
      description: Hides a coin of the catalogue from the user's catalogue and checklist
        sets; or, with sameAs, says it is the same coin as another of the same country
        and currency, which is then listed in its place (and is the user's when the
        user has either). It replaces what the user had chosen for the coin.
      parameters:
      - description: The coin's id, and the other's
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CatalogueOverrideRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Hide a coin of the catalogue, or join it to another
