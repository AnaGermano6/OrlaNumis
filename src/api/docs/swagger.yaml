        type: string
      name:
        maxLength: 200
        type: string
      noteVariant:
        enum:
        - ""
        - replacement
        - specimen
        maxLength: 20
        type: string
      notes:
        maxLength: 5000
        type: string
      numistaIssueId:
        maximum: 2147483647
        minimum: 0
        type: integer
      obverseDescription:
        maxLength: 2000
        type: string
      obverseInscription:
        maxLength: 1000
        type: string
      presentation:
        enum:
        - loose
        - coincard
        - capsule
        - flip
        - proof_set
        - blister
        - slab
        maxLength: 20
        type: string
      printer:
        maxLength: 200
        type: string
      purchaseDate:
        type: string
      purchaseLocation:
        maxLength: 500
        type: string
      purchasePrice:
        type: number
      quantity:
        description: Quantity is how many the collector has; 1 when omitted.
        maximum: 9999
        minimum: 1
        type: integer
      rarity:
        enum:
        - common
        - uncommon
        - scarce
        - rare
        - very_rare
        - extremely_rare
        maxLength: 20
        type: string
      rarityRating:
        maxLength: 100
        type: string
      referenceText:
        maxLength: 2000
        type: string
      referenceUrl:
        maxLength: 2000
        type: string
