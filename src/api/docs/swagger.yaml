      - description: Part of the issuer name
        in: query
        name: q
        required: true
        type: string
      - default: en
        description: Language of issuer names
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.NumistaCatalogIssuersResult'
