info:
  contact: {}
  description: REST API for managing a personal coin collection. Supports coin CRUD,
    image uploads, AI-powered analysis, user management, and admin features.
  title: Orla Numis API
  version: 1.0.0
paths:
  /admin/availability-cycles:
    get:
      description: Returns paginated history of admin/scheduled availability cycles
        with roll-up child counts.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List availability cycles
      tags:
      - Admin
  /admin/availability-cycles/{id}:
    get:
      description: Returns a single availability cycle with its per-owner child run
        summaries (no per-coin results).
      parameters:
      - description: Cycle ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get availability cycle detail
      tags:
      - Admin
  /admin/availability-runs:
    get:
      description: Returns paginated history of legacy (pre-cycle) wishlist availability
        check runs, including UserID=0 admin rows.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List legacy availability check runs
      tags:
      - Admin
  /admin/availability-runs/{id}:
    get:
      description: Returns a single legacy (pre-cycle) availability check run with
        all per-coin results.
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get legacy availability run detail
      tags:
      - Admin
  /admin/availability/run:
    post:
      description: Enqueues a wishlist availability check cycle (one child run per
        owner) and returns immediately. Duplicate requests while a cycle is queued
        or running are rejected.
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Trigger manual wishlist availability check
      tags:
      - Admin
  /admin/backups:
    get:
      description: 'The full backups of the backup folder, newest first: the automatic
        ones (made every day, the last ones kept), those made by hand, those made
        of the data a restore replaced, and the imported ones. Each says when its
        data was copied, its size and what it holds. Admin only.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.BackupsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Full backups
      tags:
      - Admin
    post:
      description: 'Starts a full backup (the whole database and every upload), made
        in the background: the list says when it is running, and shows it once made.
        Admin only.'
      responses:
        "202":
          description: Accepted
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Make a full backup now
      tags:
      - Admin
  /admin/backups/{name}:
    delete:
      description: Deletes a backup of the backup folder. Admin only.
      parameters:
      - description: The backup's name
        in: path
        name: name
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a full backup
      tags:
      - Admin
    get:
      description: 'The backup''s zip: manifest.json, the database (database/ancientcoins.db)
        and every upload (uploads/…). It holds every user''s data, password hashes
        included: keep it safe. Admin only.'
      parameters:
      - description: The backup's name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/zip
      responses:
        "200":
          description: The zip
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download a full backup
      tags:
      - Admin
  /admin/backups/{name}/restore:
    post:
      description: 'Replaces all the data (every user''s, the settings, the uploads)
        with the backup''s. The backup is checked, the data of now is backed up first
        (a "pre-restore" backup, to go back to it), then the app restarts and applies
        the backup as it starts: in Docker its container starts it again by itself.
        Signed-in users may have to sign in again. Admin only.'
      parameters:
      - description: The backup's name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Restore a full backup
      tags:
      - Admin
  /admin/backups/upload:
    put:
      consumes:
      - application/zip
      description: Keeps a backup's zip (a download of an earlier backup, of this
