        type: boolean
      pageUrl:
        type: string
      title:
        description: |-
          Title names the coin; a challenge's country slots leave it empty (the
          country says it).
        type: string
      toYear:
        description: ToYear is a type's last year, when it was struck over several.
        type: integer
      year:
        type: integer
    type: object
  services.CoinCopilotCapability:
    properties:
      enabled:
        type: boolean
      mode:
        type: string
      modelToolCallingSupported:
        type: boolean
      reason:
        type: string
    type: object
  services.CoinHealthItem:
    properties:
      coinId:
        type: integer
      dimensions:
        $ref: '#/definitions/services.HealthDimensionScores'
      grade:
        $ref: '#/definitions/services.HealthGrade'
