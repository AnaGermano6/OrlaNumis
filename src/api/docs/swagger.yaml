  /coins/numista-fill:
    get:
      description: 'For the user''s coins and banknotes (collection and wishlist)
        linked to a Numista type whose details the app has cached, lists what a fill
        would set: the monetary system from the type''s currency when none is set;
        and, for coins, the material from Numista''s composition when the coin''s
        is Other or empty, the weight and the diameter when missing, and a coin card
        as presentation when none is set and Numista says the type is issued in one.
        Also lists, as corrections, the coins whose material is set but differs from
        the composition. Changes nothing and makes no Numista request.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CoinNumistaFillResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Preview a fill of coin records from Numista
      tags:
      - Coins
    post:
      description: 'Saves what the preview lists (see GET /coins/numista-fill): only
        empty fields are filled, all coins or none, from the cached Numista types;
        no Numista request is made. With corrections=true, the listed material corrections
        are saved too. Returns what was changed.'
      parameters:
      - description: Also replace the materials that differ from Numista's composition
        in: query
        name: corrections
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CoinNumistaFillResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
