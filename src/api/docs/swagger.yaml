        rulers, composition, weight, size, mints, designs, references, reference photos
        with credit) and its issues. Cached for 30 days.
      parameters:
      - description: Numista type ID
        in: path
        name: id
        required: true
        type: integer
      - default: en
        description: Language of catalogue data
        in: query
        name: lang
