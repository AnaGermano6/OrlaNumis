        content hashes, notes, provider override) return the existing in-flight job
        with reused=true. A distinct submission that would exceed the per-user concurrency
        limit is refused with 409 job_at_capacity rather than being matched to an
        unrelated in-flight job.
      parameters:
      - description: Saved coin to analyse; omit for new-coin intake
